# Three aggregate agents: liquidity demand, inside liquidity, and background depth.
agents:
  - archetype: NoiseTrader
    id: noise_flow
    count: 1
    parameters:
      side: "random"
      buy_probability: 0.514
      activity: 0.485
      order_size: 600.0
      order_size_sigma: 1.3
      max_order_size: 8000.0
      lot_size: 100.0
      burst_size: 1.1
      pause_probability: 0.008
      mean_pause_steps: 15.0

  - archetype: RandomLimitOrderTrader
    id: passive_depth
    count: 1
    parameters:
      activity: 1.8
      order_size: 200.0
      price_offset: 0.05
      tick_size: 0.01
      inside_probability: 0.10
      cancel_probability: 0.01
      best_probability: 0.05

  - archetype: MultiLevelMarketMaker
    id: market_maker
    count: 1
    parameters:
      levels: 5
      spread: 0.005
      tick_size: 0.01
      order_size: 15000.0
      level_size_growth: 0.45
      level_sizes: [16350.0, 21800.0, 26350.0, 36700.0, 43500.0]
      inventory_limit: 70000.0
      inventory_skew_ticks: 2
      inventory_size_skew: 0.25
      wide_spread_probability: 0.32
      spread_state_persistence: 0.98
