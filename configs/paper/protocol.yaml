# Freeze candidate only. Do not start the paper benchmark until this file is
# approved and copied into the executable optimizer configuration, the
# reused-data limitation is documented, and the heuristic registry is validated.
status: ready_for_benchmark
loss_version: smm_v4
symbol: ASAI3

development_evaluation:
  dates_from: data.yaml#date_splits.development
  clock_strata: 10
  window_seconds: 1800
  scenarios_per_candidate: 60
  evaluation_seed: 62700
  simulation_output_retention: summary_only
  per_book_diagnostics: disabled_as_non_scientific_output

optimizer_experiment:
  methods: [random, tpe, opro_plain, opro_heuristic]
  independent_repetitions: 3
  charged_slots_per_repetition: 50
  common_initial_design: initial-design.yaml
  common_initial_slots: 12
  optimizer_seed: 20260912
  invalid_proposals: charged
  duplicate_proposals: charged
  selection_metric: development_smm_v4

posthoc_optimizer_extension:
  status: historical_only
  config: optimizer-extension.yaml
  comparison_study_name: icaif_smm_v4_optimizer_comparison
  rerun_methods: [random, tpe, opro_plain, opro_heuristic, sobol, gp_bo, cma_es, bads]
  methods: [sobol, gp_bo, cma_es, bads]
  disclosure: >
    Selected after inspection of the completed primary four-arm experiment;
    results are a post-hoc optimizer-robustness analysis, not part of the
    original frozen comparison. All eight policies are rerun under one current
    evaluator fingerprint, and legacy objectives are not mixed into this study.
  problem_classification:
    evaluation_cost: expensive
    bounds: box_constrained
    variables: continuous
    objectives: single_scalarized_smm_loss
    derivatives: unavailable
    oracle: deterministic_sample_average_with_common_random_numbers
    hidden_feasibility: simulation_validity_gates
  family_coverage:
    sobol: randomized_quasi_monte_carlo
    gp_bo: gaussian_process_bayesian_optimization
    cma_es: evolutionary_strategy
    bads: hybrid_bayesian_direct_search

prospective_component_aware_comparison:
  status: ready_to_run
  config: component-aware-comparison.yaml
  comparison_study_name: icaif_smm_v9_ticker_specific_10x30m
  llm_model_key: qwen_qwen3_8_flash_8192_routed
  tickers: [ASAI3, CSAN3, ITSA4, LREN3, MGLU3]
  parameter_scope: independent_vector_per_ticker
  book_config: ticker-books.yaml
  calibration_variable: CalibrationBooks
  test_variable: TestBooks
  split_unit: whole_date
  calibration_dates: 9
  test_dates: 9
  windows_per_date: 10
  calibration_books_per_ticker: 90
  test_books_per_ticker: 90
  archival_contract:
    calibration_raw_outputs: compact_after_validated_smm_archive
    calibration_per_trial:
      - candidate_and_status
      - objective_and_six_component_losses
      - twenty_nine_aggregate_moments_targets_differences_and_residuals
      - ninety_scenario_moment_vectors_with_date_clock_and_seed_schedule
      - validity_and_runtime_diagnostics
      - complete_opro_prompt_response_prediction_and_usage_metadata
    test_raw_outputs: retain_all_forty_selected_candidates
    purpose: permit_additional_figures_without_rerunning_selected_models
  total_books_per_ticker: 180
  statistical_cluster_unit: whole_date
  independent_clusters_per_partition: 9
  same_date_split_for_all_tickers: true
  optimizer_repetitions_per_ticker: 5
  per_book_diagnostics: disabled_as_non_scientific_output
  selection_rule: lowest_calibration_loss_across_five_repetition_incumbents
  confirmation_stage: false
  test_standardization: frozen_ticker_calibration_standard_errors
  methods: [sobol, tpe, bads, gp_bo, mo_tpe, component_gp_bo, opro_plain, opro_heuristic]
  scalar_feedback_methods: [sobol, tpe, bads, gp_bo]
  component_aware_methods: [mo_tpe, component_gp_bo, opro_plain, opro_heuristic]
  component_order: [returns, spread, imbalance, trade_size, inter_arrival, depth]
  final_aggregation: equal_weight_mean
  signed_moment_residuals: audit_only
  disclosure: >
    Specified after inspection of the completed historical optimizer results
    and before execution of this new study. This is a prospective follow-up,
    not part of the original preregistration. Each ticker is an independent
    calibration problem with its own parameter vectors and histories. All
    eight methods must be rerun under the same ticker-specific evaluator. The
    ten-window redesign excludes 18 uninspected Sobol trial files generated by
    the superseded five-window v5 operational pilot. The superseded v6 capacity
    pilot is also excluded: its 2,048-token Qwen profile produced no adaptive
    OPRO candidate or objective. V7 raised the completion ceiling but its
    first-adaptive-slot gate exposed HTTP 429 throttling from the single pinned
    provider under five-ticker concurrency. V8 keeps the same Qwen model and
    4,096-token ceiling, uses ordered Makora-to-Alibaba provider failover,
    serializes only API calls, and retries transient transport errors. The v8
    transport gate then showed that a 4,096-token ceiling remained insufficient
    for the larger heuristic prompt: four of five calls returned no usable
    object. V9 raises the ceiling to 8,192 and requires both Plain and Heuristic
    OPRO to pass the maximum-history
    49-observation zero-slot preflight. V6--v8 artifacts are excluded. Reported
    reasoning and transport attempts remain audited.

llm:
  runtime: openrouter
  gateway_config: openrouter.yaml
  model_registry: llm-models.yaml
  model_key: qwen_qwen3_8_flash_8192_routed
  model_selection_rule: one_frozen_profile_per_study
  plain_and_heuristic_share_numerical_history: true
  heuristic_registry: heuristics.yaml
  heuristic_registry_version: component_mechanisms_smm_v1
  heuristic_information: component_level_mechanisms_without_signed_residual_triggers

later_date_evaluation:
  status: accepted_non_pristine_evaluation
  dates_from: data.yaml#date_splits.test
  scenarios_per_candidate: 120
  evaluation_seed: 92700
  interpretation: >
    These six chronologically later ASAI3 dates were previously inspected.
    Report them as a reused evaluation set and explicitly acknowledge selection
    bias; do not call them untouched, pristine, or a definitive holdout.
